<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>COCO-SSD + MediaPipe Pose</title>

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<!-- MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}
video, canvas {
  position: absolute;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}
</style>
</head>

<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let cocoModel;
let pose;
let personDetected = false;

/* CAMERA */
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
    audio: false
  });
  video.srcObject = stream;
  return new Promise(r => video.onloadedmetadata = r);
}

/* COCO SSD */
async function loadCoco() {
  cocoModel = await cocoSsd.load();
}

/* MEDIAPIPE POSE */
function loadPose() {
  pose = new Pose({
    locateFile: file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    enableSegmentation: false,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onPoseResults);
}

/* DRAW POSE */
function onPoseResults(results) {
  if (!personDetected) return;

  if (results.poseLandmarks) {
    drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS,
      { color: "#00FF00", lineWidth: 3 });
    drawLandmarks(ctx, results.poseLandmarks,
      { color: "#FF0000", lineWidth: 2 });
  }
}

/* MAIN LOOP */
async function detectFrame() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  const predictions = await cocoModel.detect(video);
  personDetected = false;

  predictions.forEach(p => {
    if (p.class === "person" && p.score > 0.5) {
      personDetected = true;
      const [x, y, w, h] = p.bbox;

      ctx.strokeStyle = "lime";
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = "lime";
      ctx.font = "16px Arial";
      ctx.fillText("Person", x, y > 20 ? y - 5 : y + 20);
    }
  });

  await pose.send({ image: video });
  requestAnimationFrame(detectFrame);
}

/* START */
(async () => {
  await setupCamera();
  video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  await loadCoco();
  loadPose();

  detectFrame();
})();
</script>

</body>
</html>
