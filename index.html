<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>All-in-One AI Camera</title>

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.16.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<!-- MediaPipe -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils"></script>

<style>
body {
  margin: 0;
  background: #000;
  color: #0f0;
  font-family: Arial, sans-serif;
  text-align: center;
}
video, canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
}
#photo {
  position: fixed;
  bottom: 10px;
  right: 10px;
  width: 120px;
  border: 2px solid #0f0;
}
#status {
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.6);
  padding: 6px 12px;
  border-radius: 8px;
}
</style>
</head>

<body>
<div id="status">Initializing…</div>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<img id="photo"/>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusBox = document.getElementById("status");
const photo = document.getElementById("photo");

let cocoModel;
let blinkFrames = 0;
let captured = false;

// ---------- CAMERA ----------
navigator.mediaDevices.getUserMedia({
  video: { facingMode: "user", width: 640, height: 480 }
}).then(stream => {
  video.srcObject = stream;
});

// ---------- COCO SSD ----------
cocoSsd.load().then(m => {
  cocoModel = m;
  statusBox.innerText = "COCO-SSD loaded";
});

// ---------- FACE MESH ----------
const faceMesh = new FaceMesh({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${f}`
});
faceMesh.setOptions({
  maxNumFaces: 1,
  refineLandmarks: true
});
faceMesh.onResults(onFace);

// ---------- POSE ----------
const pose = new Pose({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${f}`
});
pose.setOptions({ modelComplexity: 1 });
pose.onResults(onPose);

// ---------- HANDS ----------
const hands = new Hands({
  locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
});
hands.setOptions({ maxNumHands: 2 });
hands.onResults(onHands);

// ---------- CAMERA LOOP ----------
const camera = new Camera(video, {
  onFrame: async () => {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    if (!cocoModel) return;

    const predictions = await cocoModel.detect(video);
    const person = predictions.find(p => p.class === "person" && p.score > 0.6);

    if (person) {
      statusBox.innerText = "Person detected";
      await faceMesh.send({ image: video });
      await pose.send({ image: video });
      await hands.send({ image: video });
    } else {
      statusBox.innerText = "No person";
    }
  },
  width: 640,
  height: 480
});
camera.start();

// ---------- FACE + BLINK ----------
function onFace(res) {
  if (!res.multiFaceLandmarks) return;

  const lm = res.multiFaceLandmarks[0];
  drawConnectors(ctx, lm, FACEMESH_TESSELATION, { color: "#00ffff", lineWidth: 1 });

  // LEFT eye landmarks
  const top = lm[159];
  const bottom = lm[145];
  const left = lm[33];
  const right = lm[133];

  const v = Math.hypot(top.x - bottom.x, top.y - bottom.y);
  const h = Math.hypot(left.x - right.x, left.y - right.y);
  const EAR = v / h;

  if (EAR < 0.18) {
    blinkFrames++;
    if (blinkFrames > 3 && !captured) capturePhoto();
  } else {
    blinkFrames = 0;
  }
}

// ---------- POSE ----------
function onPose(res) {
  if (!res.poseLandmarks) return;
  drawConnectors(ctx, res.poseLandmarks, POSE_CONNECTIONS, { color: "#00ff00" });
  drawLandmarks(ctx, res.poseLandmarks, { color: "#ff0000", radius: 3 });
}

// ---------- HANDS ----------
function onHands(res) {
  if (!res.multiHandLandmarks) return;
  for (const hand of res.multiHandLandmarks) {
    drawConnectors(ctx, hand, HAND_CONNECTIONS, { color: "#ffff00" });
    drawLandmarks(ctx, hand, { color: "#ff00ff", radius: 4 });
  }
}

// ---------- CAPTURE ----------
function capturePhoto() {
  captured = true;
  photo.src = canvas.toDataURL("image/png");
  statusBox.innerText = "📸 Blink detected – Photo captured";
}
</script>
</body>
</html>
