<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>BioMetric Pose Analyzer - Back Cam</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

    <style>
        :root {
            --primary: #00f2ff;
            --warning: #ffcc00;
            --danger: #ff3b30;
            --bg-dark: #0a0a0a;
            --glass: rgba(255, 255, 255, 0.1);
        }

        body, html {
            margin: 0; padding: 0;
            background: var(--bg-dark);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            overflow: hidden;
            height: 100%;
        }

        #viewport {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video { display: none; }

        /* Mirroring REMOVED for Back Camera */
        canvas#canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .scanline {
            position: absolute;
            top: 0; width: 100%; height: 2px;
            background: rgba(0, 242, 255, 0.5);
            box-shadow: 0 0 15px var(--primary);
            animation: scan 4s linear infinite;
            z-index: 5;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        #ui-sidebar {
            position: absolute;
            top: 20px;
            right: 20px; /* Moved to right for easier one-handed thumb access on mobile */
            width: 240px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            z-index: 10;
        }

        h1 { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin: 0 0 15px 0; color: var(--primary); }

        .metric-box { margin-bottom: 15px; }
        .label { font-size: 10px; color: #aaa; text-transform: uppercase; }
        .value { font-size: 24px; font-weight: bold; font-family: monospace; }

        .meter-container {
            width: 100%; height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px; overflow: hidden; margin-top: 5px;
        }
        #meter-fill {
            width: 0%; height: 100%;
            background: var(--primary);
            transition: width 0.3s, background 0.3s;
        }

        #alert-toast {
            position: fixed;
            bottom: 160px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--danger);
            padding: 10px 30px;
            border-radius: 50px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 100;
        }

        #graph-container {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 80px;
            background: var(--glass);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 10px;
            border: 1px solid rgba(255,255,255,0.05);
        }

        #loading {
            position: fixed; inset: 0;
            background: #000;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            z-index: 1000;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 4px solid var(--glass);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div id="loading">
    <div class="spinner"></div>
    <div style="letter-spacing: 3px; font-size: 10px;">ENGAGING BACK OPTICS...</div>
</div>

<div id="viewport">
    <div class="scanline"></div>
    <video id="video" playsinline></video>
    <canvas id="canvas"></canvas>

    <div id="ui-sidebar">
        <h1>External Scan</h1>
        
        <div class="metric-box">
            <div class="label">Structural Load</div>
            <div id="stressValue" class="value">0%</div>
            <div class="meter-container">
                <div id="meter-fill"></div>
            </div>
        </div>

        <div class="metric-box">
            <div class="label">Target Status</div>
            <div id="statusText" class="value" style="font-size: 18px; color: #34C759;">STABLE</div>
        </div>
    </div>

    <div id="alert-toast">MECHANICAL OVERLOAD</div>

    <div id="graph-container">
        <canvas id="stressGraph"></canvas>
    </div>
</div>

<script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const graphCanvas = document.getElementById("stressGraph");
    const gctx = graphCanvas.getContext("2d");

    const stressValEl = document.getElementById("stressValue");
    const meterFill = document.getElementById("meter-fill");
    const statusText = document.getElementById("statusText");
    const alertToast = document.getElementById("alert-toast");

    let stressHistory = [];
    const MAX_POINTS = 150;
    let lastGraphUpdate = 0;

    const pose = new Pose({
        locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
    });

    pose.setOptions({
        modelComplexity: 1,
        smoothLandmarks: true,
        minDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5
    });

    pose.onResults(onResults);

    async function startCamera() {
        try {
            // FORCED BACK CAMERA SETTINGS
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { 
                    facingMode: { exact: "environment" },
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                }
            }).catch(() => {
                // Fallback to standard environment if 'exact' fails
                return navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
            });

            video.srcObject = stream;
            video.play();

            const camera = new Camera(video, {
                onFrame: async () => { await pose.send({ image: video }); },
                width: 640, height: 480
            });
            camera.start();
            document.getElementById("loading").style.display = "none";
        } catch (e) {
            console.error(e);
            alert("Please allow camera access and use a device with a rear camera.");
        }
    }

    function angle(a, b, c) {
        const ang = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
        let deg = Math.abs(ang * 180 / Math.PI);
        return deg > 180 ? 360 - deg : deg;
    }

    function drawBone(a, b, stress) {
        ctx.beginPath();
        ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
        ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
        ctx.strokeStyle = stress ? "#ff3b30" : "#00f2ff";
        ctx.lineWidth = stress ? 6 : 3;
        ctx.lineCap = "round";
        ctx.stroke();
    }

    function drawGraph() {
        graphCanvas.width = graphCanvas.clientWidth;
        graphCanvas.height = graphCanvas.clientHeight;
        gctx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
        if (stressHistory.length < 2) return;
        gctx.beginPath();
        gctx.lineWidth = 2;
        gctx.strokeStyle = "#00f2ff";
        stressHistory.forEach((v, i) => {
            const x = (i / MAX_POINTS) * graphCanvas.width;
            const y = graphCanvas.height - (v / 100) * graphCanvas.height;
            if (i === 0) gctx.moveTo(x, y); else gctx.lineTo(x, y);
        });
        gctx.stroke();
    }

    function onResults(res) {
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        // NO SCALE/TRANSLATE (Removing mirroring for back camera)
        ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height);

        if (!res.poseLandmarks) return;
        const lm = res.poseLandmarks;

        const shoulderWidth = Math.abs(lm[11].x - lm[12].x);
        const headDrop = ((lm[11].y + lm[12].y) / 2) - lm[0].y;
        const neckStress = (headDrop / shoulderWidth) > 0.6;
        const armStressL = angle(lm[11], lm[13], lm[15]) < 50;
        const armStressR = angle(lm[12], lm[14], lm[16]) < 50;
        const legStressL = angle(lm[23], lm[25], lm[27]) < 150;
        const legStressR = angle(lm[24], lm[26], lm[28]) < 150;

        let score = (neckStress ? 40 : 0) + 
                    ((armStressL ? 1 : 0) + (armStressR ? 1 : 0)) * 15 + 
                    ((legStressL ? 1 : 0) + (legStressR ? 1 : 0)) * 15;
        score = Math.min(score, 100);

        stressValEl.innerText = `${score}%`;
        meterFill.style.width = `${score}%`;
        
        if(score > 70) {
            meterFill.style.background = "#ff3b30";
            statusText.innerText = "CRITICAL";
            statusText.style.color = "#ff3b30";
            alertToast.style.opacity = "1";
        } else if (score > 40) {
            meterFill.style.background = "#ffcc00";
            statusText.innerText = "WARNING";
            statusText.style.color = "#ffcc00";
            alertToast.style.opacity = "0";
        } else {
            meterFill.style.background = "#00f2ff";
            statusText.innerText = "STABLE";
            statusText.style.color = "#34C759";
            alertToast.style.opacity = "0";
        }

        drawBone(lm[11], lm[12], neckStress);
        drawBone(lm[11], lm[13], armStressL);
        drawBone(lm[13], lm[15], armStressL);
        drawBone(lm[12], lm[14], armStressR);
        drawBone(lm[14], lm[16], armStressR);
        drawBone(lm[11], lm[23], false);
        drawBone(lm[12], lm[24], false);
        drawBone(lm[23], lm[25], legStressL);
        drawBone(lm[25], lm[27], legStressL);
        drawBone(lm[24], lm[26], legStressR);
        drawBone(lm[26], lm[28], legStressR);

        const now = performance.now();
        if (now - lastGraphUpdate > 100) {
            stressHistory.push(score);
            if (stressHistory.length > MAX_POINTS) stressHistory.shift();
            lastGraphUpdate = now;
            drawGraph();
        }
    }

    startCamera();
</script>
</body>
</html>
