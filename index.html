<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Biomechanical Angle Analyzer</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils" crossorigin="anonymous"></script>

    <style>
        :root { --danger: #FF3B30; --safe: #34C759; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        
        video { position: absolute; visibility: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }

        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; box-sizing: border-box; pointer-events: none; z-index: 10;
        }

        .alert-banner {
            background: rgba(255, 59, 48, 0.85); color: white; padding: 10px 25px;
            border-radius: 8px; font-weight: bold; font-size: 14px;
            display: none; border: 1px solid white;
        }

        #loading {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; align-items: center; justify-content: center; color: white;
        }
    </style>
</head>
<body>

<div id="loading">CONNECTING TO REAR SENSORS...</div>
<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<div id="ui-overlay">
    <div id="alert-banner" class="alert-banner">MECHANICAL OVERLOAD</div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const alertBanner = document.getElementById('alert-banner');

const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

pose.onResults(onResults);

async function startBackCamera() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } } 
        });
        video.srcObject = stream;
        
        const camera = new Camera(video, {
            onFrame: async () => { await pose.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
        document.getElementById('loading').style.display = 'none';
    } catch (e) {
        // Fallback if "exact" environment fails on some browsers
        const streamFallback = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        video.srcObject = streamFallback;
        loading.style.display = 'none';
    }
}

function calcAngle(a, b, c) {
    const ang = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let deg = Math.abs(ang * 180 / Math.PI);
    return deg > 180 ? 360 - deg : deg;
}

function drawLabel(text, point, color) {
    ctx.fillStyle = "black";
    ctx.fillRect(point.x * canvas.width + 10, point.y * canvas.height - 25, 45, 20);
    ctx.fillStyle = color;
    ctx.font = "bold 14px monospace";
    ctx.fillText(`${Math.round(text)}°`, point.x * canvas.width + 15, point.y * canvas.height - 10);
}

function drawBone(a, b, stress) {
    ctx.beginPath();
    ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
    ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
    ctx.strokeStyle = stress > 0.5 ? '#FF3B30' : '#34C759';
    ctx.lineWidth = 4 + (stress * 4);
    ctx.stroke();
}

function onResults(results) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    // Draw clear background
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

    if (!results.poseLandmarks) return;
    const lm = results.poseLandmarks;

    // --- ANGLE ANALYSIS ---
    const angL_Elbow = calcAngle(lm[11], lm[13], lm[15]);
    const angR_Elbow = calcAngle(lm[12], lm[14], lm[16]);
    const angL_Knee = calcAngle(lm[23], lm[25], lm[27]);
    const angR_Knee = calcAngle(lm[24], lm[26], lm[28]);
    
    // Neck Logic
    const sWidth = Math.abs(lm[11].x - lm[12].x);
    const neckDepth = ((lm[11].y + lm[12].y)/2) - lm[0].y;
    const neckStress = (neckDepth / sWidth) < 0.45 ? 1 : 0;

    // Update Alert
    alertBanner.style.display = (neckStress || angL_Elbow < 45 || angR_Elbow < 45) ? 'block' : 'none';

    // --- DRAWING SKELETON ---
    ctx.lineCap = 'round';
    
    // Upper Body
    drawBone(lm[11], lm[12], neckStress); 
    drawBone(lm[11], lm[13], angL_Elbow < 45 ? 1 : 0); drawBone(lm[13], lm[15], angL_Elbow < 45 ? 1 : 0);
    drawBone(lm[12], lm[14], angR_Elbow < 45 ? 1 : 0); drawBone(lm[14], lm[16], angR_Elbow < 45 ? 1 : 0);
    
    // Lower Body
    drawBone(lm[23], lm[25], angL_Knee < 150 ? 1 : 0); drawBone(lm[25], lm[27], angL_Knee < 150 ? 1 : 0);
    drawBone(lm[24], lm[26], angR_Knee < 150 ? 1 : 0); drawBone(lm[26], lm[28], angR_Knee < 150 ? 1 : 0);
    
    // Connect Shoulders to Hips
    drawBone(lm[11], lm[23], 0); drawBone(lm[12], lm[24], 0); drawBone(lm[23], lm[24], 0);

    // --- ANGLE LABELS ---
    drawLabel(angL_Elbow, lm[13], angL_Elbow < 45 ? "red" : "lime");
    drawLabel(angR_Elbow, lm[14], angR_Elbow < 45 ? "red" : "lime");
    drawLabel(angL_Knee, lm[25], angL_Knee < 150 ? "red" : "lime");
    drawLabel(angR_Knee, lm[26], angR_Knee < 150 ? "red" : "lime");

    // Head Node
    ctx.fillStyle = neckStress ? "red" : "lime";
    ctx.beginPath();
    ctx.arc(lm[0].x * canvas.width, lm[0].y * canvas.height, 7, 0, 2*Math.PI);
    ctx.fill();
}

startBackCamera();
</script>
</body>
</html>
