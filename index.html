<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yoga Pose – 30s Timer</title>

<!-- TensorFlow + COCO SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<!-- MediaPipe Pose -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3"></script>

<style>
body { margin:0; overflow:hidden; background:black; }
video, canvas {
  position:absolute;
  width:100vw;
  height:100vh;
  object-fit:cover;
  transform: scaleX(-1); /* front camera mirror */
}
#timer {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 28px;
  font-weight: bold;
  color: white;
  padding: 6px 16px;
  border-radius: 20px;
  background: rgba(0,0,0,0.5);
}
</style>
</head>

<body>
<div id="timer">⏱ 0.0 s</div>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const timerEl = document.getElementById("timer");

let cocoModel, pose;
let activeBox = null;

/* TIMER STATE */
let holdStart = null;
let holdSeconds = 0;
const TARGET_TIME = 30;

/* CAMERA – FRONT */
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "user" },
    audio: false
  });
  video.srcObject = stream;
  return new Promise(r => video.onloadedmetadata = r);
}

/* ANGLE */
function angle(a,b,c){
  const ab={x:a.x-b.x,y:a.y-b.y};
  const cb={x:c.x-b.x,y:c.y-b.y};
  const dot=ab.x*cb.x+ab.y*cb.y;
  const mag=Math.hypot(ab.x,ab.y)*Math.hypot(cb.x,cb.y);
  return Math.acos(dot/mag)*180/Math.PI;
}

/* TADASANA CHECK */
function isTadasana(lm){
  const ls=lm[11], rs=lm[12];
  const lh=lm[23], rh=lm[24];
  const lk=lm[25], rk=lm[26];
  const la=lm[27], ra=lm[28];

  return (
    Math.abs(ls.y-rs.y)<0.03 &&
    Math.abs(lh.y-rh.y)<0.03 &&
    angle(lh,lk,la)>165 &&
    angle(rh,rk,ra)>165
  );
}

/* POSE INIT */
function initPose(){
  pose = new Pose({
    locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/pose@0.5/${f}`
  });
  pose.setOptions({
    modelComplexity:1,
    smoothLandmarks:true,
    minDetectionConfidence:0.5,
    minTrackingConfidence:0.5
  });
  pose.onResults(onPose);
}

/* DRAW + TIMER */
function onPose(res){
  if(!activeBox || !res.poseLandmarks) return;

  const matched = isTadasana(res.poseLandmarks);

  /* TIMER LOGIC */
  if(matched){
    if(!holdStart) holdStart = performance.now();
    holdSeconds = (performance.now() - holdStart) / 1000;
  } else {
    holdStart = null;
    holdSeconds = 0;
  }

  const done = holdSeconds >= TARGET_TIME;
  const color = done ? "#00ff00" : matched ? "#00ff00" : "#ff0000";

  timerEl.textContent = done
    ? "✅ Pose Completed"
    : `⏱ ${holdSeconds.toFixed(1)} s`;

  ctx.save();
  ctx.beginPath();
  ctx.rect(activeBox.x,activeBox.y,activeBox.w,activeBox.h);
  ctx.clip();

  drawConnectors(ctx,res.poseLandmarks,POSE_CONNECTIONS,{color,lineWidth:3});
  drawLandmarks(ctx,res.poseLandmarks,{color,lineWidth:2});

  ctx.restore();
}

/* MAIN */
(async()=>{
  await setupCamera();
  video.play();
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  cocoModel = await cocoSsd.load();
  initPose();

  async function loop(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.drawImage(video,0,0,canvas.width,canvas.height);

    const preds = await cocoModel.detect(video);
    activeBox = null;

    preds.forEach(p=>{
      if(p.class==="person" && p.score>0.5){
        const [x,y,w,h]=p.bbox;
        activeBox={x,y,w,h};
        ctx.strokeStyle="#00ff00";
        ctx.lineWidth=2;
        ctx.strokeRect(x,y,w,h);
      }
    });

    await pose.send({image:video});
    requestAnimationFrame(loop);
  }
  loop();
})();
</script>
</body>
</html>
