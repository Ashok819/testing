<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>COCO-SSD 3D Cube Bounding Box</title>

<!-- TensorFlow -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}
video, canvas {
  position: absolute;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
}
</style>
</head>

<body>
<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let model;

/* CAMERA */
async function setupCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: "environment" },
    audio: false
  });
  video.srcObject = stream;
  return new Promise(r => video.onloadedmetadata = r);
}

/* DRAW 3D CUBE */
function draw3DCube(x, y, w, h) {
  const depth = Math.min(w, h) * 0.15;

  const x2 = x + depth;
  const y2 = y - depth;

  ctx.strokeStyle = "#00ffcc";
  ctx.lineWidth = 3;

  // Front rectangle
  ctx.strokeRect(x, y, w, h);

  // Back rectangle
  ctx.strokeRect(x2, y2, w, h);

  // Connecting edges
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.lineTo(x2, y2);

  ctx.moveTo(x + w, y);
  ctx.lineTo(x2 + w, y2);

  ctx.moveTo(x, y + h);
  ctx.lineTo(x2, y2 + h);

  ctx.moveTo(x + w, y + h);
  ctx.lineTo(x2 + w, y2 + h);
  ctx.stroke();
}

/* MAIN */
async function main() {
  await setupCamera();
  video.play();

  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  model = await cocoSsd.load();

  async function detect() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

    const predictions = await model.detect(video);

    predictions.forEach(p => {
      if (p.class === "person" && p.score > 0.5) {
        const [x, y, w, h] = p.bbox;
        draw3DCube(x, y, w, h);

        ctx.fillStyle = "#00ffcc";
        ctx.font = "16px Arial";
        ctx.fillText(
          `Person ${(p.score * 100).toFixed(1)}%`,
          x,
          y > 20 ? y - 8 : y + 18
        );
      }
    });

    requestAnimationFrame(detect);
  }

  detect();
}

main();
</script>
</body>
</html>
