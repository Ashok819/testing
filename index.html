<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Biomechanical Stress Analyzer</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils" crossorigin="anonymous"></script>

    <style>
        :root { --danger: #FF3B30; --safe: #34C759; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        video { position: absolute; visibility: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        .mirror { transform: scaleX(-1); }

        #ui-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center;
            padding: 20px; box-sizing: border-box; pointer-events: none; z-index: 10;
        }

        .btn {
            background: rgba(255, 255, 255, 0.2); backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.3); color: white;
            padding: 12px 20px; border-radius: 12px; font-weight: bold;
            pointer-events: auto; cursor: pointer; margin-top: 10px;
        }

        .alert-banner {
            background: var(--danger); color: white; padding: 12px 30px;
            border-radius: 50px; font-weight: bold; font-size: 14px;
            display: none; margin-bottom: auto;
        }

        #loading {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; align-items: center; justify-content: center; color: white;
        }
    </style>
</head>
<body>

<div id="loading">INITIALIZING SENSORS...</div>
<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<div id="ui-overlay">
    <div id="alert-banner" class="alert-banner">HIGH MECHANICAL STRESS</div>
    <button class="btn" onclick="toggleCamera()">🔄 SWITCH CAMERA</button>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const alertBanner = document.getElementById('alert-banner');

let currentFacingMode = "user"; // "user" = front, "environment" = back
let activeCamera = null;

const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

pose.onResults(onResults);

async function startCamera() {
    if (activeCamera) {
        await activeCamera.stop();
    }

    // Mirror only if using front camera
    if (currentFacingMode === "user") {
        canvas.classList.add('mirror');
    } else {
        canvas.classList.remove('mirror');
    }

    try {
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: currentFacingMode }
        });
        video.srcObject = stream;
        
        activeCamera = new Camera(video, {
            onFrame: async () => { await pose.send({image: video}); },
            width: 640, height: 480
        });
        activeCamera.start();
        document.getElementById('loading').style.display = 'none';
    } catch (e) {
        alert("Camera Error: " + e);
    }
}

function toggleCamera() {
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    startCamera();
}

function calcAngle(a, b, c) {
    const ang = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let deg = Math.abs(ang * 180 / Math.PI);
    return deg > 180 ? 360 - deg : deg;
}

function drawStressLine(a, b, stressLevel) {
    if (!a || !b) return;
    const r = Math.floor(52 + (203 * stressLevel));
    const g = Math.floor(199 - (140 * stressLevel));
    const bColor = Math.floor(89 - (50 * stressLevel));

    ctx.beginPath();
    ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
    ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
    ctx.strokeStyle = `rgb(${r},${g},${bColor})`;
    ctx.lineWidth = 4 + (stressLevel * 6);
    ctx.lineCap = 'round';
    ctx.stroke();
}

function onResults(results) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    ctx.save();
    // If front camera, we need to flip the drawing of the image
    if (currentFacingMode === "user") {
        ctx.scale(-1, 1);
        ctx.translate(-canvas.width, 0);
    }
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    if (!results.poseLandmarks) return;
    const lm = results.poseLandmarks;

    // --- STRESS CALCULATION ---
    const sWidth = Math.abs(lm[11].x - lm[12].x);
    const neckDepth = ((lm[11].y + lm[12].y)/2) - lm[0].y;
    const neckStress = Math.min(1, Math.max(0, (0.45 - (neckDepth / sWidth)) * 5));
    
    const angL = calcAngle(lm[11], lm[13], lm[15]);
    const angR = calcAngle(lm[12], lm[14], lm[16]);
    const armStress = (angL < 50 || angR < 50) ? 1 : 0;

    const kneeL = calcAngle(lm[23], lm[25], lm[27]);
    const kneeR = calcAngle(lm[24], lm[26], lm[28]);
    const legStress = (kneeL < 155 || kneeR < 155) ? 1 : 0;

    alertBanner.style.display = (neckStress > 0.5 || armStress > 0.5) ? 'block' : 'none';

    // --- DRAW SKELETON ---
    drawStressLine(lm[11], lm[12], neckStress); 
    drawStressLine(lm[11], lm[13], armStress); drawStressLine(lm[13], lm[15], armStress);
    drawStressLine(lm[12], lm[14], armStress); drawStressLine(lm[14], lm[16], armStress);
    drawStressLine(lm[11], lm[23], 0); drawStressLine(lm[12], lm[24], 0);
    drawStressLine(lm[23], lm[24], 0);
    drawStressLine(lm[23], lm[25], legStress); drawStressLine(lm[25], lm[27], legStress);
    drawStressLine(lm[24], lm[26], legStress); drawStressLine(lm[26], lm[28], legStress);

    ctx.fillStyle = neckStress > 0.5 ? '#FF3B30' : '#34C759';
    ctx.beginPath();
    ctx.arc(lm[0].x * canvas.width, lm[0].y * canvas.height, 8, 0, 2*Math.PI);
    ctx.fill();
}

startCamera();
</script>
</body>
</html>
