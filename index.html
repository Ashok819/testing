<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
<title>COCO-SSD Person Detection</title>

<!-- TensorFlow.js -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.12.0"></script>

<!-- COCO-SSD -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: black;
}
video, canvas {
  position: absolute;
  top: 0;
  left: 0;
}
#status {
  position: fixed;
  bottom: 10px;
  left: 50%;
  transform: translateX(-50%);
  color: white;
  font-size: 14px;
  background: rgba(0,0,0,0.6);
  padding: 6px 12px;
  border-radius: 8px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline muted></video>
<canvas id="canvas"></canvas>
<div id="status">Loading model…</div>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

let model;

// 1️⃣ Start Camera (Back Camera)
async function startCamera() {
  const stream = await navigator.mediaDevices.getUserMedia({
    video: { facingMode: { ideal: "environment" } },
    audio: false
  });
  video.srcObject = stream;

  return new Promise(resolve => {
    video.onloadedmetadata = () => {
      video.play();
      resolve();
    };
  });
}

// 2️⃣ Load COCO-SSD
async function loadModel() {
  model = await cocoSsd.load();
  statusText.innerText = "Model loaded. Detecting…";
}

// 3️⃣ Detection Loop
async function detect() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  const predictions = await model.detect(video);

  predictions.forEach(pred => {
    if (pred.class === "person") {
      const [x, y, w, h] = pred.bbox;

      ctx.strokeStyle = "lime";
      ctx.lineWidth = 3;
      ctx.strokeRect(x, y, w, h);

      ctx.fillStyle = "lime";
      ctx.font = "16px Arial";
      ctx.fillText(
        `Person ${(pred.score * 100).toFixed(1)}%`,
        x,
        y > 20 ? y - 5 : y + 20
      );
    }
  });

  requestAnimationFrame(detect);
}

// 4️⃣ Init
(async () => {
  await startCamera();
  await loadModel();
  detect();
})();
</script>

</body>
</html>
