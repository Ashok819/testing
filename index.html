<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AI Stress Analysis - Full Body</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils" crossorigin="anonymous"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: sans-serif; }
        
        /* Video hidden, canvas displays everything */
        video { position: absolute; visibility: hidden; }
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; transform: scaleX(-1); }

        #ui-overlay {
            position: fixed; top: 20px; left: 0; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            pointer-events: none; z-index: 10;
        }

        .alert-badge {
            background: rgba(255, 59, 48, 0.9); color: white; padding: 12px 25px;
            border-radius: 50px; font-weight: bold; font-size: 14px;
            display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            animation: pulse 1s infinite;
        }

        @keyframes pulse { 0% {opacity: 1} 50% {opacity: 0.7} 100% {opacity: 1} }

        #loading {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; align-items: center; justify-content: center; color: white;
        }
    </style>
</head>
<body>

<div id="loading">CONNECTING TO BIOMETRIC SENSORS...</div>
<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<div id="ui-overlay">
    <div id="alert-badge" class="alert-badge">HIGH MECHANICAL STRESS</div>
</div>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const alertBadge = document.getElementById('alert-badge');

const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

pose.onResults(onResults);

async function startApp() {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
        video.srcObject = stream;
        video.onloadedmetadata = () => {
            video.play();
            const camera = new Camera(video, {
                onFrame: async () => { await pose.send({image: video}); },
                width: 640, height: 480
            });
            camera.start();
            document.getElementById('loading').style.display = 'none';
        };
    } catch (e) {
        document.getElementById('loading').innerText = "CAMERA ACCESS DENIED";
    }
}

function calcAngle(a, b, c) {
    const ang = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let deg = Math.abs(ang * 180 / Math.PI);
    return deg > 180 ? 360 - deg : deg;
}

function drawStressBone(a, b, isStressed) {
    if (!a || !b) return;
    ctx.beginPath();
    ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
    ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
    ctx.strokeStyle = isStressed ? '#FF3B30' : '#34C759'; // Red if stressed, Green if safe
    ctx.lineWidth = isStressed ? 8 : 4;
    ctx.lineCap = 'round';
    ctx.stroke();
}

function onResults(results) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    // Draw Camera Feed
    ctx.save();
    ctx.scale(-1, 1);
    ctx.translate(-canvas.width, 0);
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    if (!results.poseLandmarks) return;
    const lm = results.poseLandmarks;

    // --- ANALYSIS LOGIC ---
    
    // 1. Neck/Cervical Stress
    const sWidth = Math.abs(lm[11].x - lm[12].x);
    const headHeight = ((lm[11].y + lm[12].y)/2) - lm[0].y;
    const neckStress = (headHeight / sWidth) < 0.45;

    // 2. Arm/Elbow Stress
    const angL = calcAngle(lm[11], lm[13], lm[15]);
    const angR = calcAngle(lm[12], lm[14], lm[16]);
    const armStress = (angL < 50 || angR < 50);

    // 3. Leg/Knee Stress (Detects deep bending or crouching)
    const kneeL = calcAngle(lm[23], lm[25], lm[27]);
    const kneeR = calcAngle(lm[24], lm[26], lm[28]);
    const legStress = (kneeL < 155 || kneeR < 155);

    // Show/Hide Warning
    alertBadge.style.display = (neckStress || armStress || legStress) ? 'block' : 'none';

    // --- DRAW FULL BIOMECHANICAL SKELETON ---
    
    // Upper Body
    drawStressBone(lm[11], lm[12], neckStress); // Neck Base
    drawStressBone(lm[11], lm[13], armStress); drawStressBone(lm[13], lm[15], armStress); // Left Arm
    drawStressBone(lm[12], lm[14], armStress); drawStressBone(lm[14], lm[16], armStress); // Right Arm
    
    // Core/Torso
    drawStressBone(lm[11], lm[23], false); 
    drawStressBone(lm[12], lm[24], false);
    drawStressBone(lm[23], lm[24], false); // Pelvis
    
    // Lower Body
    drawStressBone(lm[23], lm[25], legStress); drawStressBone(lm[25], lm[27], legStress); // Left Leg
    drawStressBone(lm[24], lm[26], legStress); drawStressBone(lm[26], lm[28], legStress); // Right Leg

    // Head Point
    ctx.fillStyle = neckStress ? '#FF3B30' : '#34C759';
    ctx.beginPath();
    ctx.arc(lm[0].x * canvas.width, lm[0].y * canvas.height, 10, 0, 2*Math.PI);
    ctx.fill();
}

startApp();
</script>
</body>
</html>
