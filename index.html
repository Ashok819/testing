<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Biometric Back Camera Analyzer</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils" crossorigin="anonymous"></script>

    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: 'Courier New', monospace; }
        video { position: absolute; visibility: hidden; }
        /* Mirroring removed for back camera accuracy */
        canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; object-fit: cover; }
        
        #loading {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; align-items: center; justify-content: center; color: #34C759; letter-spacing: 2px;
        }
    </style>
</head>
<body>

<div id="loading">CONNECTING REAR SENSORS...</div>
<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<script>
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

pose.onResults(onResults);

// --- HARD-CODED BACK CAMERA INIT ---
async function startBackCamera() {
    try {
        // Request the environment camera specifically
        const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } },
            audio: false
        });
        video.srcObject = stream;
        
        const camera = new Camera(video, {
            onFrame: async () => { await pose.send({image: video}); },
            width: 1280, height: 720
        });
        camera.start();
        document.getElementById('loading').style.display = 'none';
    } catch (e) {
        // Fallback for browsers that don't support "exact" constraint
        try {
            const streamFallback = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            });
            video.srcObject = streamFallback;
            const camera = new Camera(video, {
                onFrame: async () => { await pose.send({image: video}); },
                width: 1280, height: 720
            });
            camera.start();
            document.getElementById('loading').style.display = 'none';
        } catch (err) {
            document.getElementById('loading').innerText = "CAMERA ERROR: " + err.name;
        }
    }
}

function calcAngle(a, b, c) {
    const ang = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let deg = Math.abs(ang * 180 / Math.PI);
    return deg > 180 ? 360 - deg : deg;
}

function drawLabel(text, point, color) {
    const x = point.x * canvas.width;
    const y = point.y * canvas.height;
    
    // Label Background
    ctx.fillStyle = "rgba(0,0,0,0.8)";
    ctx.fillRect(x + 10, y - 25, 50, 22);
    // Label Text
    ctx.fillStyle = color;
    ctx.font = "bold 15px monospace";
    ctx.fillText(`${Math.round(text)}°`, x + 14, y - 9);
}

function drawBone(a, b, isStressed) {
    ctx.beginPath();
    ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
    ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
    ctx.strokeStyle = isStressed ? '#FF3B30' : '#34C759';
    ctx.lineWidth = isStressed ? 6 : 3;
    ctx.stroke();
}

function onResults(results) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    
    // Draw raw camera feed (unmirrored)
    ctx.drawImage(results.image, 0, 0, canvas.width, canvas.height);

    if (!results.poseLandmarks) return;
    const lm = results.poseLandmarks;

    // --- ANGLE DATA ---
    const angLElbow = calcAngle(lm[11], lm[13], lm[15]);
    const angRElbow = calcAngle(lm[12], lm[14], lm[16]);
    const angLKnee = calcAngle(lm[23], lm[25], lm[27]);
    const angRKnee = calcAngle(lm[24], lm[26], lm[28]);

    ctx.lineCap = 'round';
    
    // --- DRAW SKELETON ---
    // Arms (Stress if bent too far)
    drawBone(lm[11], lm[13], angLElbow < 45); drawBone(lm[13], lm[15], angLElbow < 45);
    drawBone(lm[12], lm[14], angRElbow < 45); drawBone(lm[14], lm[16], angRElbow < 45);
    
    // Legs (Stress if bent > squat)
    drawBone(lm[23], lm[25], angLKnee < 150); drawBone(lm[25], lm[27], angLKnee < 150);
    drawBone(lm[24], lm[26], angRKnee < 150); drawBone(lm[26], lm[28], angRKnee < 150);
    
    // Core (Shoulders, Hips, Torso)
    drawBone(lm[11], lm[12], false); 
    drawBone(lm[11], lm[23], false); drawBone(lm[12], lm[24], false);
    drawBone(lm[23], lm[24], false);

    // --- DRAW DATA LABELS ---
    drawLabel(angLElbow, lm[13], angLElbow < 45 ? "red" : "lime");
    drawLabel(angRElbow, lm[14], angRElbow < 45 ? "red" : "lime");
    drawLabel(angLKnee, lm[25], angLKnee < 150 ? "red" : "lime");
    drawLabel(angRKnee, lm[26], angRKnee < 150 ? "red" : "lime");

    // Nose Reference Point
    ctx.fillStyle = "#34C759";
    ctx.beginPath();
    ctx.arc(lm[0].x * canvas.width, lm[0].y * canvas.height, 5, 0, 2*Math.PI);
    ctx.fill();
}

startBackCamera();
</script>
</body>
</html>
