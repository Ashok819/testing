<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI Full Body Stress Analysis</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils"></script>

<style>
html, body {
    margin: 0;
    padding: 0;
    background: black;
    overflow: hidden;
    font-family: Arial, sans-serif;
}

video { display: none; }

canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    transform: scaleX(-1);
}

#ui-overlay {
    position: fixed;
    top: 15px;
    width: 100%;
    text-align: center;
    z-index: 10;
    pointer-events: none;
}

.alert {
    display: none;
    background: rgba(255,59,48,0.9);
    color: white;
    padding: 12px 25px;
    border-radius: 30px;
    font-weight: bold;
}

#stressScore {
    margin-top: 10px;
    background: rgba(0,0,0,0.7);
    color: #34C759;
    padding: 10px 20px;
    border-radius: 25px;
    font-weight: bold;
}

#stressGraph {
    position: fixed;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    width: 90vw;
    height: 120px;
    background: rgba(0,0,0,0.65);
    border-radius: 15px;
    z-index: 20;
}

#loading {
    position: fixed;
    inset: 0;
    background: black;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
}
</style>
</head>

<body>

<div id="loading">CONNECTING TO CAMERA...</div>

<video id="video" playsinline></video>
<canvas id="canvas"></canvas>

<div id="ui-overlay">
    <div id="alert" class="alert">HIGH MECHANICAL STRESS</div>
    <div id="stressScore">Stress: 0%</div>
</div>

<canvas id="stressGraph"></canvas>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const graphCanvas = document.getElementById("stressGraph");
const gctx = graphCanvas.getContext("2d");

const alertEl = document.getElementById("alert");
const stressScoreEl = document.getElementById("stressScore");

let stressHistory = [];
const MAX_POINTS = 300;
let lastGraphUpdate = 0;

const pose = new Pose({
    locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
});

pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
});

pose.onResults(onResults);

// CAMERA (BACK FIRST)
async function startCamera() {
    let stream;
    try {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: { exact: "environment" } }
        });
    } catch {
        stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user" }
        });
    }

    video.srcObject = stream;
    video.play();

    const camera = new Camera(video, {
        onFrame: async () => {
            await pose.send({ image: video });
        },
        width: 640,
        height: 480
    });

    camera.start();
    document.getElementById("loading").style.display = "none";
}

function angle(a, b, c) {
    const ang = Math.atan2(c.y - b.y, c.x - b.x) -
                Math.atan2(a.y - b.y, a.x - b.x);
    let deg = Math.abs(ang * 180 / Math.PI);
    return deg > 180 ? 360 - deg : deg;
}

function drawBone(a, b, stress) {
    ctx.beginPath();
    ctx.moveTo(a.x * canvas.width, a.y * canvas.height);
    ctx.lineTo(b.x * canvas.width, b.y * canvas.height);
    ctx.strokeStyle = stress ? "#FF3B30" : "#34C759";
    ctx.lineWidth = stress ? 7 : 4;
    ctx.lineCap = "round";
    ctx.stroke();
}

function drawGraph() {
    graphCanvas.width = graphCanvas.clientWidth;
    graphCanvas.height = graphCanvas.clientHeight;

    gctx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);

    gctx.strokeStyle = "rgba(255,255,255,0.1)";
    for (let i = 0; i <= 100; i += 25) {
        const y = graphCanvas.height - (i / 100) * graphCanvas.height;
        gctx.beginPath();
        gctx.moveTo(0, y);
        gctx.lineTo(graphCanvas.width, y);
        gctx.stroke();
    }

    if (stressHistory.length < 2) return;

    gctx.beginPath();
    gctx.lineWidth = 3;

    stressHistory.forEach((v, i) => {
        const x = (i / MAX_POINTS) * graphCanvas.width;
        const y = graphCanvas.height - (v / 100) * graphCanvas.height;
        gctx.strokeStyle = v > 70 ? "#FF3B30" : v > 40 ? "#FF9500" : "#34C759";
        if (i === 0) gctx.moveTo(x, y);
        else gctx.lineTo(x, y);
    });

    gctx.stroke();
}

function onResults(res) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    ctx.save();
    ctx.scale(-1, 1);
    ctx.translate(-canvas.width, 0);
    ctx.drawImage(res.image, 0, 0, canvas.width, canvas.height);
    ctx.restore();

    if (!res.poseLandmarks) return;
    const lm = res.poseLandmarks;

    // STRESS LOGIC
    const shoulderWidth = Math.abs(lm[11].x - lm[12].x);
    const headDrop = ((lm[11].y + lm[12].y) / 2) - lm[0].y;
    const neckStress = (headDrop / shoulderWidth) > 0.6;

    const angL = angle(lm[11], lm[13], lm[15]);
    const angR = angle(lm[12], lm[14], lm[16]);
    const armStressL = angL < 50;
    const armStressR = angR < 50;

    const kneeL = angle(lm[23], lm[25], lm[27]);
    const kneeR = angle(lm[24], lm[26], lm[28]);
    const legStressL = kneeL < 150;
    const legStressR = kneeR < 150;

    // SCORE
    const armCount = (armStressL?1:0)+(armStressR?1:0);
    const legCount = (legStressL?1:0)+(legStressR?1:0);

    let stressScore = (neckStress?40:0)+(armCount*15)+(legCount*15);
    stressScore = Math.min(stressScore,100);

    stressScoreEl.innerText = `Stress: ${stressScore}%`;
    stressScoreEl.style.color = stressScore>70?"#FF3B30":stressScore>40?"#FF9500":"#34C759";
    alertEl.style.display = stressScore > 60 ? "inline-block" : "none";

    // SKELETON
    drawBone(lm[11], lm[12], neckStress);
    drawBone(lm[11], lm[13], armStressL);
    drawBone(lm[13], lm[15], armStressL);
    drawBone(lm[12], lm[14], armStressR);
    drawBone(lm[14], lm[16], armStressR);
    drawBone(lm[11], lm[23], false);
    drawBone(lm[12], lm[24], false);
    drawBone(lm[23], lm[24], false);
    drawBone(lm[23], lm[25], legStressL);
    drawBone(lm[25], lm[27], legStressL);
    drawBone(lm[24], lm[26], legStressR);
    drawBone(lm[26], lm[28], legStressR);

    // GRAPH DATA
    const now = performance.now();
    if (now - lastGraphUpdate > 200) {
        stressHistory.push(stressScore);
        if (stressHistory.length > MAX_POINTS) stressHistory.shift();
        lastGraphUpdate = now;
    }

    drawGraph();
}

startCamera();
</script>
</body>
</html>
